<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BagueDor 🔥</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: monospace; }
    header { padding: 20px; text-align: center; border-bottom: 2px solid #FF4D00; }
    h1 { color: #FF4D00; font-size: 24px; }
    #info { padding: 15px; text-align: center; font-size: 14px; color: #aaa; }
    #controls { display: flex; justify-content: center; gap: 20px; padding: 15px; }
    button { padding: 12px 30px; border: none; border-radius: 8px; font-size: 16px; font-family: monospace; cursor: pointer; font-weight: bold; }
    #btn-start { background: #FF4D00; color: #fff; }
    #btn-stop { background: #333; color: #fff; }
    #status { text-align: center; font-size: 13px; color: #FF4D00; padding-bottom: 10px; }
    #map { width: 100%; height: 60vh; }
  </style>
</head>
<body>
  <header><h1>🔥 BagueDor — Tracker</h1></header>
  <div id="controls">
    <button id="btn-start" onclick="sendCommand('start')">▶ START</button>
    <button id="btn-stop" onclick="sendCommand('stop')">■ STOP</button>
  </div>
  <div id="status">En attente...</div>
  <div id="info">Chargement de la position...</div>
  <div id="map"></div>

  <script>
    const FIREBASE_URL = "https://baguedor-default-rtdb.firebaseio.com";

    async function sendCommand(cmd) {
      await fetch(`${FIREBASE_URL}/command.json`, {
        method: "PUT",
        body: JSON.stringify(cmd)
      });
      document.getElementById("status").innerText =
        cmd === "start" ? "✅ Commande START envoyée" : "🛑 Commande STOP envoyée";
    }

    async function loadPosition() {
      const res = await fetch(`${FIREBASE_URL}/location.json`);
      const data = await res.json();
      if (!data) return;
      const lat = data.latitude;
      const lng = data.longitude;
      const time = new Date(data.timestamp * 1000).toLocaleString();
      document.getElementById("info").innerHTML =
        `📍 Lat: ${lat} | Lng: ${lng} | ⏱ ${time}`;
      const mapUrl = `https://maps.google.com/maps?q=${lat},${lng}&z=16&output=embed`;
      document.getElementById("map").innerHTML =
        `<iframe width="100%" height="100%" src="${mapUrl}" frameborder="0"></iframe>`;
    }

    loadPosition();
    setInterval(loadPosition, 30000);
  </script>
</body>
</html>
